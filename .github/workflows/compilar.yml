# Pruebas en cada cambio y el instalador de Windows compilado solo.
# Cada push a main deja el instalador como artefacto de la ejecución.
# Una etiqueta v* (por ejemplo v0.1.0) además publica una versión descargable.

name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del núcleo y del formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Núcleo de geometría (23,72 · 26,20 · 2,48 cm, largos, corte, huellas)
        run: npm test
      - name: Interfaz
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esquemas y ejemplos
        run: |
          pip install jsonschema
          python herramientas/validar_ejemplos.py .

  windows:
    name: Instalador de Windows
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Compilar PATTRN
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: PATTRN-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
