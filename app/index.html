<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PATTRN</title>
  <link rel="stylesheet" href="./estilo.css">
</head>
<body>
  <header>
    <div>
      <h1>PATTRN</h1>
      <p>Moldería libre para upcycling · versión 0.1.0</p>
    </div>
    <div class="archivo">
      <button id="abrir">Abrir proyecto…</button>
      <button id="guardar-como">Guardar como…</button>
      <span id="estado-archivo" role="status"></span>
    </div>
  </header>
  <main>
    <section id="lienzo" aria-label="Molde"></section>
    <aside>
      <h2 id="nombre-molde"></h2>
      <div id="aviso" role="status"></div>
      <div id="opciones"></div>
      <ul class="leyenda">
        <li><span class="muestra costura"></span>costura</li>
        <li><span class="muestra union"></span>unión</li>
        <li><span class="muestra terminado"></span>terminado</li>
        <li><span class="muestra cambia"></span>cambia con la resolución</li>
      </ul>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
