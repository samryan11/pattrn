<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PATTRN</title>
  <link rel="stylesheet" href="./estilo.css">
</head>
<body>
  <!-- Las pantallas: de la idea al molde descargado -->
  <div id="app"></div>

  <!-- El taller: uniones entre fragmentos e importador de fotos -->
  <div id="taller" hidden>
    <header>
      <div>
        <h1>PATTRN · Taller</h1>
        <p>Uniones entre fragmentos e importación desde foto</p>
      </div>
      <div class="archivo">
        <button id="volver-del-taller">← Volver a PATTRN</button>
        <button id="importar">Importar desde foto…</button>
        <input id="foto-entrada" type="file" accept="image/jpeg,image/png" hidden>
        <button id="abrir">Abrir proyecto…</button>
        <button id="guardar-como">Guardar como…</button>
        <span id="estado-archivo" role="status"></span>
      </div>
    </header>
    <main>
      <section id="lienzo" aria-label="Molde"></section>
      <aside>
        <h2 id="nombre-molde"></h2>
        <div id="aviso" role="status"></div>
        <div id="opciones"></div>
        <ul class="leyenda">
          <li><span class="muestra costura"></span>costura</li>
          <li><span class="muestra union"></span>unión</li>
          <li><span class="muestra terminado"></span>terminado</li>
          <li><span class="muestra cambia"></span>cambia con la resolución</li>
        </ul>
      </aside>
    </main>
  </div>
  <script type="module" src="./pantallas.ts"></script>
</body>
</html>
